
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusCare Admin Dashboard</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #263238;
}

header {
    background: #12345a;
    color: white;
    padding: 18px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 { font-size: 23px; }

button {
    background: #00a99d;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

#logoutBtn { background: #e74c3c; }

button:disabled { opacity: 0.6; }

main {
    max-width: 1100px;
    margin: auto;
    padding: 25px 18px;
}

.welcome { margin-bottom: 25px; }

.welcome h2 {
    color: #12345a;
    margin-bottom: 8px;
}

.welcome p { color: #64748b; }

.section-title {
    margin: 25px 0 15px;
    color: #12345a;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    border-left: 4px solid #00a99d;
}

.card p {
    color: #64748b;
    font-size: 14px;
    margin-bottom: 12px;
}

.card h3 {
    font-size: 28px;
    color: #12345a;
}

.pending { border-left-color: #f39c12; }
.progress { border-left-color: #3498db; }
.resolved { border-left-color: #27ae60; }

.management {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.filters {
    display: flex;
    gap: 10px;
    margin: 18px 0;
    flex-wrap: wrap;
}

.filters input,
.filters select {
    padding: 11px;
    border: 1px solid #ccd3dc;
    border-radius: 6px;
    font-size: 14px;
    flex: 1;
    min-width: 130px;
}

.complaint {
    border: 1px solid #ddd;
    padding: 16px;
    border-radius: 8px;
    margin: 15px 0;
    background: white;
}

.complaint h3 {
    color: #12345a;
    overflow-wrap: anywhere;
}

.complaint p {
    margin: 9px 0;
    overflow-wrap: anywhere;
}

.complaint label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
}

.complaint select {
    padding: 10px;
    margin-top: 7px;
    border: 1px solid #ccd3dc;
    border-radius: 6px;
    width: 100%;
}

.message {
    margin: 15px 0;
    color: #64748b;
}

.empty {
    text-align: center;
    padding: 25px;
    background: #f8fafc;
    border-radius: 8px;
    color: #64748b;
}

footer {
    text-align: center;
    padding: 20px;
    color: #64748b;
}

@media(max-width: 650px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    header h1 { font-size: 19px; }
}
</style>
</head>

<body>

<header>
    <h1>CampusCare Admin</h1>
    <button id="logoutBtn">Logout</button>
</header>

<main>

<section class="welcome">
    <h2>Dashboard Overview</h2>
    <p>Welcome to the CampusCare complaint management system.</p>
</section>

<h3 class="section-title">Complaint Statistics</h3>

<section class="stats">

    <div class="card">
        <p>Total Complaints</p>
        <h3 id="totalCount">0</h3>
    </div>

    <div class="card pending">
        <p>Pending</p>
        <h3 id="pendingCount">0</h3>
    </div>

    <div class="card progress">
        <p>In Progress</p>
        <h3 id="progressCount">0</h3>
    </div>

    <div class="card resolved">
        <p>Resolved</p>
        <h3 id="resolvedCount">0</h3>
    </div>

</section>

<h3 class="section-title">Complaint Management</h3>

<section class="management">

    <h3>Student Complaints</h3>

    <div class="filters">

        <input
            type="search"
            id="searchComplaint"
            placeholder="Search reference number..."
        >

        <select id="categoryFilter">
            <option value="">All Categories</option>
            <option>Water Problem</option>
            <option>Electricity</option>
            <option>Classroom</option>
            <option>Washroom</option>
            <option>Library</option>
            <option>Laboratory</option>
            <option>College Bus</option>
            <option>Cleanliness</option>
            <option>Other</option>
        </select>

    </div>

    <button id="refreshBtn">Refresh Complaints</button>

    <p class="message" id="dashboardMessage">Loading complaints...</p>

    <div id="complaintsList"></div>

</section>

</main>

<footer>
    <p>CampusCare | Developed by Team HumanTech</p>
</footer>

<script type="module">

import { supabase } from "./js/supabase.js";

const totalCount = document.getElementById("totalCount");
const pendingCount = document.getElementById("pendingCount");
const progressCount = document.getElementById("progressCount");
const resolvedCount = document.getElementById("resolvedCount");

const complaintsList = document.getElementById("complaintsList");
const dashboardMessage = document.getElementById("dashboardMessage");

const searchInput = document.getElementById("searchComplaint");
const categoryFilter = document.getElementById("categoryFilter");

const refreshBtn = document.getElementById("refreshBtn");

let allComplaints = [];

function updateStatistics() {

    totalCount.textContent = allComplaints.length;

    pendingCount.textContent =
        allComplaints.filter(c => c.status === "Pending").length;

    progressCount.textContent =
        allComplaints.filter(c => c.status === "In Progress").length;

    resolvedCount.textContent =
        allComplaints.filter(c => c.status === "Resolved").length;
}

function displayComplaints() {

    complaintsList.replaceChildren();

    const search = searchInput.value.trim().toLowerCase();
    const category = categoryFilter.value;

    const filtered = allComplaints.filter(c => {

        const matchesSearch =
            (c.reference_number || "").toLowerCase().includes(search);

        const matchesCategory =
            !category || c.category === category;

        return matchesSearch && matchesCategory;
    });

    if (filtered.length === 0) {

        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No matching complaints found.";

        complaintsList.appendChild(empty);
        return;
    }

    filtered.forEach(c => {

        const card = document.createElement("div");
        card.className = "complaint";

        const heading = document.createElement("h3");
        heading.textContent = c.reference_number;

        const categoryText = document.createElement("p");
        categoryText.textContent = "Category: " + c.category;

        const location = document.createElement("p");
        location.textContent = "Location: " + c.location;

        const description = document.createElement("p");
        description.textContent = "Description: " + c.description;

        const date = document.createElement("p");
        date.textContent =
            "Submitted: " + new Date(c.created_at).toLocaleString();

        const statusLabel = document.createElement("label");
        statusLabel.textContent = "Complaint Status";

        const select = document.createElement("select");

        ["Pending", "In Progress", "Resolved"].forEach(status => {

            const option = document.createElement("option");
            option.value = status;
            option.textContent = status;

            select.appendChild(option);

        });

        select.value = c.status;

        const updateButton = document.createElement("button");
        updateButton.textContent = "Update Status";

        updateButton.addEventListener("click", async () => {

            updateButton.disabled = true;
            updateButton.textContent = "Updating...";

            const { data, error } =
                await supabase.functions.invoke(
                    "admin-update-status",
                    {
                        body: {
                            id: c.id,
                            status: select.value
                        }
                    }
                );

            if (error || !data?.success) {

                alert(
                    data?.error ||
                    error?.message ||
                    "Status update failed."
                );

                updateButton.disabled = false;
                updateButton.textContent = "Update Status";
                return;
            }

            alert("Complaint status updated successfully.");

            await loadComplaints();

        });

        card.append(
            heading,
            categoryText,
            location,
            description,
            date,
            statusLabel,
            select,
            updateButton
        );

        complaintsList.appendChild(card);

    });

}

async function loadComplaints() {

    dashboardMessage.textContent = "Loading complaints...";
    refreshBtn.disabled = true;

    try {

        const { data, error } =
            await supabase.functions.invoke("admin-list-complaints");

        if (error || !data?.success) {

            dashboardMessage.textContent =
                data?.error || error?.message ||
                "Unable to load complaints.";

            allComplaints = [];
            updateStatistics();
            complaintsList.replaceChildren();

            return;
        }

        allComplaints = data.complaints || [];

        updateStatistics();
        displayComplaints();

        dashboardMessage.textContent =
            "Total complaints loaded: " + allComplaints.length;

    } catch (error) {

        dashboardMessage.textContent =
            "Error: " + error.message;

    } finally {

        refreshBtn.disabled = false;

    }

}

searchInput.addEventListener("input", displayComplaints);
categoryFilter.addEventListener("change", displayComplaints);

refreshBtn.addEventListener("click", loadComplaints);

document.getElementById("logoutBtn")
.addEventListener("click", async () => {

    const { error } = await supabase.auth.signOut();

    if (error) {
        alert("Logout failed: " + error.message);
        return;
    }

    window.location.href = "admin.html";

});

// Check whether an authenticated admin session exists.

const { data: sessionData, error: sessionError } =
    await supabase.auth.getSession();

if (sessionError || !sessionData.session) {

    window.location.href = "admin.html";

} else {

    const { data, error } =
        await supabase.functions.invoke("admin-list-complaints");

    if (error || !data?.success) {

        await supabase.auth.signOut();
        window.location.href = "admin.html";

    } else {

        allComplaints = data.complaints || [];
        updateStatistics();
        displayComplaints();

        dashboardMessage.textContent =
            "Total complaints loaded: " + allComplaints.length;

    }

}

</script>

</body>
</html>
